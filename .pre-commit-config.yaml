# ruff-format намеренно не включён: репозиторий не отформатирован под него
# (пробный прогон переписал 342 файла). Включать — только осознанным
# отдельным коммитом-переформатом, не хуком исподтишка.
# rev держим в ногу с ruff из dev-зависимостей — расхождение версий
# включает/выключает правила (v0.6.9 находил UP038 там, где 0.15.x чист).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
