name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,rich]"
      - run: python -m pytest tests/ -x -q

  # The frontend unit suite (vitest). It existed but was never run in CI, so a
  # broken reactflow mock sat failing on master unnoticed. Node version matches
  # e2e.yml. Type errors fail the job too — tsc is what catches a component
  # reading a field the API does not send.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Observer mode (#73) integrates with the *real* CrewAI library. The core
  # `test` job above skips those tests (CrewAI isn't in [dev]); this job pins the
  # supported CrewAI version(s) and runs the newcomer-path integration tests
  # against each. Keep the matrix in sync with docs/features/observe.md.
  observe-crewai:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crewai-version: ["0.86.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,rich]" "crewai==${{ matrix.crewai-version }}"
      - name: Newcomer-path integration tests
        run: python -m pytest tests/integration/test_observe_crewai_integration.py tests/unit/adapters/test_observe_crewai.py -q
