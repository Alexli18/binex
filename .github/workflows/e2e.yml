name: E2E Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          pip install -e ".[dev,rich]"
          playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd ui
          npm ci
          npm run build
          cp -r dist ../src/binex/ui/static

      - name: Start server
        run: |
          python -c "
          import uvicorn
          from binex.ui.server import create_app
          uvicorn.run(create_app(), host='127.0.0.1', port=8420, log_level='warning')
          " > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8420/api/v1/health && exit 0
            sleep 1
          done
          echo "Server did not become healthy in 30s" >&2
          exit 1

      - name: Run E2E Playwright tests
        # --timeout-method=thread: the default signal method can deadlock
        # xdist workers when SIGALRM lands inside Playwright's sync greenlet;
        # thread kills the wedged worker instead of hanging the whole run.
        # 120s budget absorbs cold chromium startup on shared CI vCPUs.
        # No --video: traces already include a screencast, video doubles load.
        run: pytest -m e2e -n auto --timeout=120 --timeout-method=thread --screenshot=only-on-failure --tracing=retain-on-failure

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results/
            server.log
          if-no-files-found: ignore
          retention-days: 7
