name: my-workflow
nodes:
  human-input_4:
    agent: human://input
    outputs:
      - output
    inputs:
      query: ${user.query}
  planner:
    agent: llm://gemini/gemini-2.5-flash
    depends_on:
      - human-input_4
    inputs:
      human-input_4: ${human-input_4.output}
    outputs:
      - output
    system_prompt: file://prompts/gen-research-planner.md
  researcher:
    agent: llm://gemini/gemini-2.5-flash
    outputs:
      - output
    system_prompt: file://prompts/gen-researcher.md
    depends_on:
      - planner
    inputs:
      planner: ${planner.output}
  summarizer:
    agent: llm://gemini/gemini-2.5-flash
    outputs:
      - output
    system_prompt: file://prompts/gen-research-synthesizer.md
    depends_on:
      - researcher
    inputs:
      researcher: ${researcher.output}
  human-output_3:
    agent: human://output
    outputs:
      - output
    depends_on:
      - summarizer
    inputs:
      summarizer: ${summarizer.output}
