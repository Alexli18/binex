name: simple
nodes:
  human-input_1:
    agent: human://input
    outputs:
      - output
    inputs:
      query: ${user.query}
  human-output_2:
    agent: human://output
    outputs:
      - output
    depends_on:
      - consumer
    inputs:
      consumer: ${consumer.output}
  consumer:
    agent: local://echo
    outputs:
      - output
    system_prompt: consume
    depends_on:
      - producer
    inputs:
      producer: ${producer.output}
  producer:
    agent: local://echo
    outputs:
      - output
    system_prompt: produce
    depends_on:
      - human-input_1
    inputs:
      human-input_1: ${human-input_1.output}
  test:
    type: loop
    loop:
      max_iterations: 5
      accumulate: false
      contains:
        - consumer
        - producer
      exit:
        field: $.status
        operator: '=='
        value: 'true'
      entry_node: producer
      output_node: consumer
